[package]
name = "clouddrop"
version = "0.2.0"
edition = "2024"
description = "Upload-only Google Drive folder for Linux: daemon and CLI"
license = "MIT"
repository = "https://github.com/Dhiva-Labs/CloudDrop"
homepage = "https://github.com/Dhiva-Labs/CloudDrop"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
md-5 = "0.11.0"
mime_guess = "2.0.5"
notify = "8.2.0"
notify-rust = "4.18.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "query", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_Storage_Packaging_Appx", "Win32_System_IO", "Win32_System_Threading"] }
cloud-filter = "0.0.6"
# The Microsoft Store package's startup task (start at sign-in).
windows = { version = "0.62", features = ["ApplicationModel"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

[workspace]
members = ["tray", "gui", "win"]
