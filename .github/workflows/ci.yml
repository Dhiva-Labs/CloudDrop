name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release (for example v0.2.0) to attach the Windows zips to (those it lacks). Leave empty to only build.
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The desktop app needs GTK 4.12+ and libadwaita 1.6+ (Ubuntu 24.10 or newer).
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev dbus python3 python3-gi python3-nautilus \
            file xvfb xauth
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core, end-to-end and desktop app tests
        run: cargo test -p clouddrop -p clouddrop-gui
      - name: Top-bar icon tests (private session bus)
        run: dbus-run-session -- cargo test -p clouddrop-tray
      - name: Files extension tests
        run: python3 -m unittest discover -s nautilus/tests
      - name: The binaries are ${{ matrix.elf_machine }}, and the desktop app starts
        env:
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          uname -m
          cargo build -p clouddrop -p clouddrop-gui
          for f in clouddrop clouddrop-gui; do
            desc="$(file -b "target/debug/$f")"
            echo "$f: $desc"
            case "$desc" in
              ELF*"$ELF_MACHINE"*) ;;
              *) echo "::error::target/debug/$f is not $ELF_MACHINE"; exit 1 ;;
            esac
          done
          target/debug/clouddrop --version
          # The window under a virtual display, with its own HOME and settings: it must
          # still be running when `timeout` stops it (exit code 124).
          export HOME="$RUNNER_TEMP/smoke-home"
          export CLOUDDROP_CONFIG="$HOME/config.toml" CLOUDDROP_DATA_DIR="$HOME/data"
          mkdir -p "$HOME"
          rc=0
          GSK_RENDERER=cairo xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- timeout 15 target/debug/clouddrop-gui || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "::error::clouddrop-gui exited with code $rc instead of staying up"
            exit 1
          fi

  # The Ubuntu PPA source package, built the way Launchpad builds it: the pinned
  # toolchain and the crates come from packaging/vendor/, with nothing from the
  # network during the build itself.
  deb:
    name: Debian package ${{ matrix.deb_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            rust_cpu: x86_64
            runner: ubuntu-latest
            elf_machine: x86-64
          - deb_arch: arm64
            rust_cpu: aarch64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential debhelper fakeroot dpkg-dev pkg-config \
            libgtk-4-dev libadwaita-1-dev xz-utils python3 file xvfb xauth dbus
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vendor the toolchain and the crates (packaging/vendor/)
        run: |
          RUST_VERSION="$(sed -n 's/^RUST_VERSION := //p' debian/rules)"
          TRIPLE="${{ matrix.rust_cpu }}-unknown-linux-gnu"
          echo "Rust $RUST_VERSION for $TRIPLE"
          cd packaging/vendor
          for c in rustc cargo rust-std; do
            f="$c-$RUST_VERSION-$TRIPLE.tar.xz"
            curl -fsSL -O "https://static.rust-lang.org/dist/$f"
            curl -fsSL -O "https://static.rust-lang.org/dist/$f.sha256"
            sha256sum -c "$f.sha256"
            rm "$f.sha256"
          done
          cd ../..
          ./packaging/vendor/make-crates.sh
          cat packaging/vendor/SHA256SUMS
      - name: Build the package
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir -p dist
          mv ../clouddrop_*.deb dist/
      - name: Check the package, install it and start it
        env:
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l dist
          deb="$(ls dist/clouddrop_*_${{ matrix.deb_arch }}.deb)"
          dpkg-deb --info "$deb"
          [ "$(dpkg-deb --field "$deb" Architecture)" = "${{ matrix.deb_arch }}" ]
          apt-get install -y --no-install-recommends "./$deb"
          for f in /usr/bin/clouddrop /usr/bin/clouddrop-gui; do
            desc="$(file -b "$f")"
            echo "$f: $desc"
            case "$desc" in
              ELF*"$ELF_MACHINE"*) ;;
              *) echo "::error::$f is not $ELF_MACHINE"; exit 1 ;;
            esac
          done
          clouddrop --version
          export HOME="$RUNNER_TEMP/smoke-home"
          export CLOUDDROP_CONFIG="$HOME/config.toml" CLOUDDROP_DATA_DIR="$HOME/data"
          mkdir -p "$HOME"
          rc=0
          GSK_RENDERER=cairo xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- timeout 15 clouddrop-gui || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "::error::clouddrop-gui exited with code $rc instead of staying up"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clouddrop-deb-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - name: The snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE" meta/snap.yaml bin
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          for f in clouddrop clouddrop-gui; do
            desc="$(file -b "$RUNNER_TEMP/snap/bin/$f")"
            echo "$f: $desc"
            case "$desc" in
              ELF*"$ELF_MACHINE"*) ;;
              *) echo "::error::bin/$f is not $ELF_MACHINE"; exit 1 ;;
            esac
          done
      - name: Install the snap and run it
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous "$SNAP_FILE"
          /snap/bin/clouddrop --version
      - uses: actions/upload-artifact@v4
        with:
          name: clouddrop-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_host: x86_64-pc-windows-msvc
            pe_machine: '0x8664'
          - arch: arm64
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc
            pe_machine: '0xAA64'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: The toolchain builds for ${{ matrix.rust_host }}
        run: |
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          rustc -vV
          $triple = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          if ($triple -ne '${{ matrix.rust_host }}') { throw "rustc builds for $triple" }
      - name: Clippy (core and agent)
        run: cargo clippy -p clouddrop -p clouddrop-agent --all-targets -- -D warnings
      - name: Core and end-to-end tests
        run: cargo test -p clouddrop
      - name: File Explorer cloud-folder test (real Cloud Files API)
        run: cargo test -p clouddrop-agent -- --nocapture
      - name: Build the agent
        run: cargo build --release -p clouddrop -p clouddrop-agent
      - name: The binaries are ${{ matrix.pe_machine }}
        run: |
          ./.github/scripts/check-pe-machine.ps1 -Path target/release/clouddrop.exe, target/release/clouddrop-agent.exe `
            -Machine ${{ matrix.pe_machine }}
          target/release/clouddrop.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: clouddrop-windows-${{ matrix.arch }}
          path: |
            target/release/clouddrop.exe
            target/release/clouddrop-agent.exe

  app:
    name: App tests ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # There are no Flutter SDK archives for Linux arm64, so every leg clones the release tag.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Configure Flutter
        working-directory: winapp
        run: |
          uname -m
          flutter config --no-analytics
          flutter --version
          dart --version
      - run: flutter pub get
        working-directory: winapp
      - run: flutter analyze
        working-directory: winapp
      - name: App tests (logic, widgets, screenshots)
        working-directory: winapp
        run: flutter test

  windows-package:
    name: Windows package ${{ matrix.arch }}
    needs: [windows, app]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            pe_machine: '0x8664'
            elf_machine: '0x3E'
          - arch: arm64
            runner: windows-11-arm
            pe_machine: '0xAA64'
            elf_machine: '0xB7'
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      # On an ARM64 host the Flutter bootstrap fetches the arm64 Dart SDK and
      # `flutter build windows` targets windows-arm64. There are no SDK archives
      # for it, so every leg clones the release tag.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"
      - name: Configure Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          flutter config --no-analytics --enable-windows-desktop
          flutter precache --windows
          flutter --version
          dart --version
      - name: Show the Visual Studio C++ components and the Windows SDK tools
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property displayName
          foreach ($c in 'VC.Tools.x86.x64', 'VC.Tools.ARM64', 'VC.ATL', 'VC.ATL.ARM64') {
            $path = & $vswhere -latest -products * -requires "Microsoft.VisualStudio.Component.$c" -property installationPath
            '{0,-20} {1}' -f $c, ($(if ($path) { 'installed' } else { 'missing' }))
          }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\*\makeappx.exe', 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\*\signtool.exe' |
            Select-Object -ExpandProperty FullName
      - name: Build the app
        working-directory: winapp
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          flutter build windows --release
      - name: The app is ${{ matrix.pe_machine }}
        run: |
          ./.github/scripts/check-pe-machine.ps1 -Path "winapp/build/windows/$env:ARCH/runner/Release" `
            -Machine ${{ matrix.pe_machine }} -ElfMachine ${{ matrix.elf_machine }} `
            -Require clouddrop_app.exe, flutter_windows.dll
      - uses: actions/download-artifact@v4
        with:
          name: clouddrop-windows-${{ matrix.arch }}
          path: engine
      - name: Assemble the test package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $out = "dist/CloudDrop-$version-windows-$env:ARCH"
          New-Item -ItemType Directory -Force "$out/CloudDrop" | Out-Null
          Copy-Item -Recurse "winapp/build/windows/$env:ARCH/runner/Release/*" "$out/CloudDrop"
          Copy-Item engine/clouddrop.exe, engine/clouddrop-agent.exe "$out/CloudDrop"
          Copy-Item packaging/windows/install.cmd, packaging/windows/install.ps1, packaging/windows/uninstall.ps1, packaging/windows/README.txt $out
          Set-Content "$out/VERSION" $version -NoNewline
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: The package is ${{ matrix.pe_machine }}
        run: |
          ./.github/scripts/check-pe-machine.ps1 -Path "dist/CloudDrop-$env:VERSION-windows-$env:ARCH/CloudDrop" `
            -Machine ${{ matrix.pe_machine }} -ElfMachine ${{ matrix.elf_machine }} `
            -Require clouddrop_app.exe, clouddrop.exe, clouddrop-agent.exe
      - name: Start the app from the package
        timeout-minutes: 5
        run: |
          # Its own settings and data, so nothing of this machine is touched. The window is
          # shown by the first Flutter frame, so a visible window means the compiled Dart
          # code ran.
          $smoke = Join-Path $env:RUNNER_TEMP 'app-smoke'
          $env:CLOUDDROP_CONFIG = "$smoke\config.toml"
          $env:CLOUDDROP_DATA_DIR = "$smoke\data"
          $exe = (Resolve-Path "dist/CloudDrop-$env:VERSION-windows-$env:ARCH/CloudDrop/clouddrop_app.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          $up = $false
          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { throw "clouddrop_app.exe exited early with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0) {
              "window '$($p.MainWindowTitle)' is up after ${i}s"
              $up = $true
              break
            }
          }
          if (-not $up) {
            Stop-Process -Id $p.Id -Force
            throw 'no window after 90 s'
          }
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "clouddrop_app.exe died after showing its window (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CloudDrop-${{ env.VERSION }}-windows-${{ matrix.arch }}
          path: dist/
      - name: Microsoft Store package for the artifacts (Partner Center identity, unsigned)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force msix | Out-Null
          & .\packaging\windows\msix\build-msix.ps1 -Arch $env:ARCH -Dist "dist\CloudDrop-$env:VERSION-windows-$env:ARCH\CloudDrop" -Out "msix\CloudDrop-$env:VERSION-$env:ARCH.msix"
          Get-ChildItem msix | Format-Table Name, Length
      - name: The Store package declares and holds ${{ matrix.arch }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $file = (Resolve-Path "msix/CloudDrop-$env:VERSION-$env:ARCH.msix").Path
          $contents = Join-Path $env:RUNNER_TEMP 'msix-contents'
          [IO.Compression.ZipFile]::ExtractToDirectory($file, $contents)
          $manifest = [xml](Get-Content -Raw (Join-Path $contents 'AppxManifest.xml'))
          $id = $manifest.Package.Identity
          "msix identity: Name=$($id.Name) Version=$($id.Version) ProcessorArchitecture=$($id.ProcessorArchitecture) Publisher=$($id.Publisher)"
          if ($id.ProcessorArchitecture -ne $env:ARCH) { throw "ProcessorArchitecture is $($id.ProcessorArchitecture)" }
          if ($id.Name -ne 'Dhiva-Labs.CloudDrop') { throw "identity is $($id.Name)" }
          ./.github/scripts/check-pe-machine.ps1 -Path $contents `
            -Machine ${{ matrix.pe_machine }} -ElfMachine ${{ matrix.elf_machine }} `
            -Require clouddrop_app.exe, clouddrop.exe, clouddrop-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CloudDrop-${{ env.VERSION }}-msix-${{ matrix.arch }}
          path: msix/
          if-no-files-found: error
      - name: Microsoft Store package, installed and checked inside the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pub = 'CN=CloudDrop CI'
          $msix = "$env:RUNNER_TEMP\clouddrop-ci.msix"
          & .\packaging\windows\msix\build-msix.ps1 -Name 'CloudDrop.CI' -Publisher $pub -Arch $env:ARCH -Dist "dist\CloudDrop-$env:VERSION-windows-$env:ARCH\CloudDrop" -Out $msix
          # A throwaway certificate, trusted on this CI machine only, to install it.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $pub -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.19={text}')
          $pw = ConvertTo-SecureString -String 'ci' -Force -AsPlainText
          $pfx = "$env:RUNNER_TEMP\ci.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          # signtool of this machine's architecture, else the x64 one (emulated on Windows on ARM).
          $dirs = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64', 'x64' } else { 'x64' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*' -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { $bin = $_.FullName; $dirs | ForEach-Object { Join-Path $bin "$_\signtool.exe" } } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          "signtool: $signtool"
          & $signtool sign /fd SHA256 /f $pfx /p ci $msix
          if ($LASTEXITCODE) { throw 'signing failed' }
          Add-AppxPackage $msix
          $pkg = Get-AppxPackage CloudDrop.CI
          "installed $($pkg.PackageFullName)"
          # Name_Version_Architecture_ResourceId_PublisherId
          if ($pkg.PackageFullName -notlike "*_$($env:ARCH)__*") { throw "installed for another architecture: $($pkg.PackageFullName)" }

          # The command-line alias runs with the package's identity.
          $cli = "$env:LOCALAPPDATA\Microsoft\WindowsApps\clouddrop.exe"
          $status = & $cli status --json | ConvertFrom-Json
          if ($status.configured -ne $false) { throw "unexpected status: $status" }
          & $cli service status --json
          & $cli service disable
          $svc = & $cli service status --json | ConvertFrom-Json
          if ($svc.at_login) { throw 'the startup task is still enabled after disable' }
          & $cli service enable
          $svc = & $cli service status --json | ConvertFrom-Json
          "after enable: $svc"
          if (-not $svc.at_login) { throw 'service enable did not turn on the startup task' }

          # File Explorer cloud folder from inside the package.
          $root = "$env:RUNNER_TEMP\selftest"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId CloudDrop -Command "$($pkg.InstallLocation)\clouddrop-agent.exe" -Args "--selftest $root"
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$root.result"); $i++) { Start-Sleep 1 }
          $result = Get-Content "$root.result" -ErrorAction SilentlyContinue
          "self-test: $result"
          Get-Process clouddrop* -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-AppxPackage $pkg.PackageFullName
          if ($result -ne 'ok') { throw "cloud folder self-test inside the package: $result" }

  # Attaches the Windows zips to a release, the way the x64 zip was attached: each zip is
  # the CI artifact of the windows-package job. Assets already on the release are left
  # alone (a hand-uploaded file wins, and nothing is overwritten); CI adds the others.
  # Runs on every event, so the asset selection is exercised on pull requests; only the
  # upload is limited to a published release (or a manual run naming one).
  release:
    name: Release assets
    needs: [windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: CloudDrop-*-windows-*
          path: assets
          merge-multiple: true
      - name: Make CloudDrop-<version>-windows-<arch>.zip for x64 and arm64
        id: select
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          find assets -maxdepth 3 | sort
          mkdir -p release
          for arch in x64 arm64; do
            NAME="CloudDrop-${VERSION}-windows-${arch}"
            [ -f "assets/$NAME/CloudDrop/clouddrop_app.exe" ]
            (cd assets && zip -qr "../release/$NAME.zip" "$NAME")
            unzip -l "release/$NAME.zip" | grep -q "$NAME/CloudDrop/clouddrop-agent.exe"
            unzip -l "release/$NAME.zip" | grep -q "$NAME/install.cmd"
          done
          ls -l release
          unzip -l "release/CloudDrop-${VERSION}-windows-arm64.zip" | sed -n '1,12p;$p'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload what the release does not have yet
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match the version in Cargo.toml ($VERSION)"
            exit 1
          fi
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in release/*.zip; do
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "$name is already on $TAG: left as it is"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
