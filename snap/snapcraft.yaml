name: clouddrop
title: CloudDrop
base: core24
version: '0.3.0'
summary: Upload a folder to Google Drive and free up space without losing anything
description: |
  Anything you put in ~/CloudDrop is uploaded to Google Drive with the same
  folder structure, under a CloudDrop folder in My Drive. Deleting a file
  locally never deletes it from Drive: it becomes cloud-only, stays listed in
  CloudDrop, and can be downloaded back at any time. So you can free up space
  on your computer without losing anything, by hand or automatically.

  - Uploads new and edited files; edits become new versions of the same file.
  - Keeps your folders; renames and moves are applied in Drive without
    uploading again.
  - Free Up Space by hand or automatically, after 7, 30 or 90 days; local
    copies are removed only after checking Google Drive holds an identical copy.
  - Resumable uploads that survive network drops, restarts and crashes.
  - Desktop app (setup assistant, Home, Files, Activity, Settings) and a
    top-bar status icon. The background service starts when you log in.

  CloudDrop asks Google only for access to the files it creates itself
  (drive.file), and files go straight between your computer and Google.

  The Ubuntu PPA (ppa:dhiva-labs/apps) also adds status icons and actions to
  the Files app, which a snap can't do.
license: MIT
grade: stable
confinement: strict
icon: data/icons/hicolor/scalable/apps/com.dhivalabs.CloudDrop.svg
website: https://github.com/Dhiva-Labs/CloudDrop
source-code: https://github.com/Dhiva-Labs/CloudDrop
issues: https://github.com/Dhiva-Labs/CloudDrop/issues
contact: reachout@dhivalabs.com

platforms:
  amd64:
  arm64:

environment:
  # The uploaded folder is the real ~/CloudDrop. Settings, the state database
  # and the sign-in stay in the snap's own directory, the same for every app
  # below (the desktop launcher would otherwise move XDG_* for the GUI only).
  HOME: $SNAP_REAL_HOME
  CLOUDDROP_CONFIG: $SNAP_USER_COMMON/config.toml
  CLOUDDROP_DATA_DIR: $SNAP_USER_COMMON/data
  XDG_CONFIG_HOME: $SNAP_USER_DATA/.config

apps:
  clouddrop:
    command: bin/clouddrop
    plugs: [home, network, network-bind, desktop]
  gui:
    command: bin/clouddrop-gui
    desktop: usr/share/applications/com.dhivalabs.CloudDrop.desktop
    common-id: com.dhivalabs.CloudDrop
    extensions: [gnome]
    plugs: [home, network, network-bind, unity7]
  # The top-bar icon; the app turns it on by writing
  # $SNAP_USER_DATA/.config/autostart/clouddrop-tray.desktop.
  tray:
    command: bin/clouddrop-gui --tray
    autostart: clouddrop-tray.desktop
    extensions: [gnome]
    plugs: [home, network, network-bind, unity7]
  # The upload engine, started with the desktop session once setup turned on
  # "start at sign-in" ($SNAP_USER_DATA/.config/autostart/clouddrop-engine.desktop).
  engine:
    command: bin/clouddrop run
    autostart: clouddrop-engine.desktop
    plugs: [home, network, network-bind, desktop]

parts:
  clouddrop:
    # Built with the pinned toolchain installed by rustup-init: the rust
    # plugin's rustup integration is fragile in managed builds.
    plugin: nil
    source: .
    build-packages:
      - curl
      - gcc
      - pkg-config
    override-build: |
      # The CloudDrop OAuth clients (Google's, and the OneDrive and Dropbox client
      # ids): not in git, written by packaging/set-oauth-client.sh before a store build.
      if [ -f packaging/oauth-client.env ]; then
        set -a; . packaging/oauth-client.env; set +a
      fi
      # Packaged builds never offer experimental providers (Proton Drive): docs/PROVIDERS.md.
      unset CLOUDDROP_EXPERIMENTAL_PROVIDERS
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup" CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      export RUSTUP_TOOLCHAIN=1.97.1
      curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --no-modify-path
      "$CARGO_HOME/bin/cargo" build --release --locked -p clouddrop -p clouddrop-gui
      install -Dm755 target/release/clouddrop "$CRAFT_PART_INSTALL/bin/clouddrop"
      install -Dm755 target/release/clouddrop-gui "$CRAFT_PART_INSTALL/bin/clouddrop-gui"
  data:
    plugin: dump
    source: data
    organize:
      com.dhivalabs.CloudDrop.desktop: usr/share/applications/com.dhivalabs.CloudDrop.desktop
      com.dhivalabs.CloudDrop.metainfo.xml: usr/share/metainfo/com.dhivalabs.CloudDrop.metainfo.xml
      icons: usr/share/icons
