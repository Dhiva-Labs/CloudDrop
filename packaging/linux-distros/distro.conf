# Package metadata for the other-distribution packages (.rpm, Arch package,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. They repackage the .deb that CI builds
# from debian/ (the PPA's packaging); keep this in step with debian/control.

NAME=clouddrop
APP_NAME=CloudDrop
GITHUB_REPO=Dhiva-Labs/CloudDrop
TAG_PREFIX=v
SUMMARY='Upload-only cloud folder (Google Drive, OneDrive, Dropbox, ...)'
DESCRIPTION='CloudDrop uploads everything you put in ~/CloudDrop to your cloud, with the same folder structure: Google Drive, OneDrive, Dropbox, Nextcloud or another WebDAV server, S3-compatible storage, SFTP or MEGA. Deleting a file on your computer never deletes it in the cloud: it becomes cloud-only and can be downloaded back at any time, so you can free up space without losing anything. It includes a desktop app with a setup assistant, a file browser and an activity history, a top-bar status icon, status icons and actions in GNOME Files, and a background service (a systemd user unit) that resumes interrupted uploads.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/CloudDrop
LICENSE=MIT
LICENSE_FILE=LICENSE

# Libraries (GTK 4, libadwaita, ...) come from the ELF files, but sonames
# carry no minimum version: the .deb's floors (GTK 4.12, libadwaita 1.6) are
# added under Fedora's and openSUSE's package names, so dnf and zypper refuse
# an older release instead of the app failing to start. The .deb also depends
# on xdg-utils: links and files are opened with xdg-open.
RPM_REQUIRES=(
  /usr/bin/xdg-open
  '((gtk4 >= 4.12) or (libgtk-4-1 >= 4.12))'
  '((libadwaita >= 1.6) or (libadwaita-1-0 >= 1.6))'
)
# The .deb's Recommends: the GNOME Files extension needs nautilus-python
# (Fedora) or python3-nautilus (openSUSE), and GNOME Shell shows the top-bar
# icon only with the AppIndicator extension.
RPM_RECOMMENDS=('(nautilus-python or python3-nautilus)' gnome-shell-extension-appindicator)
RPM_SUGGESTS=()
ARCH_DEPENDS=(glibc gcc-libs glib2 'gtk4>=4.12' 'libadwaita>=1.6' pango graphene xdg-utils)
ARCH_OPTDEPENDS=(
  'python-nautilus: status icons and actions in GNOME Files'
  'gnome-shell-extension-appindicator: the top-bar icon on GNOME Shell'
)
ARCH_INDEPENDENT=0

# No AppImage (and no Flatpak): the background service is the systemd user
# unit in /usr/lib/systemd/user, which the desktop app enables and starts
# with `systemctl --user`. Neither format can install that unit (nor the
# Files extension), and outside the snap the app has no other way to start
# the engine, so nothing would upload.
APPIMAGE=0

# Smoke tests run in each distribution container by verify.sh. SMOKE_CMD: the
# engine's command line answers, as the Windows package check does, with
# settings of its own. GUI_CMD: the desktop app must still be running after
# SMOKE_SECONDS under Xvfb, as in CI's .deb check.
CMD=clouddrop
SMOKE_CMD='clouddrop --version | grep -F "$VERSION"
export CLOUDDROP_CONFIG=/tmp/cd-smoke/config.toml CLOUDDROP_DATA_DIR=/tmp/cd-smoke/data
mkdir -p /tmp/cd-smoke
clouddrop status --json | tee /dev/stderr | grep -E "\"configured\": ?false" > /dev/null'
GUI_CMD='env GSK_RENDERER=cairo CLOUDDROP_CONFIG=/tmp/smoke-home/config.toml CLOUDDROP_DATA_DIR=/tmp/smoke-home/data clouddrop-gui'
SMOKE_SECONDS=20
SMOKE_PKGS_DNF=()
SMOKE_PKGS_SUSE=()
SMOKE_PKGS_ARCH=()
APPIMAGE_HOST_PKGS_DNF=()
